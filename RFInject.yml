dataset: SARZarr
model: MSFormer_10_128_SS
distributed: True
num_classes: 1
img_size: 224
crop_pct: 1.0
scale:
    - 1.0
    - 1.0
interpolation: bicubic
train_interpolation: bicubic
aa: rand-m9-mstd0.5-inc1
mixup: 0.0
mixup_off_epoch: 0
mixup_prob: 1.0
mixup_mode: batch
mixup_switch_prob: 0.5
cutmix: 0.0
reprob: 0.25
remode: const
amp: True
batch_size: 2
val_batch_size: 1
lr: 5e-4
min_lr: 0.00001
sched: cosine
weight_decay: 5e-2
epochs: 300
cooldown_epochs: 10
warmup_epochs: 20
warmup_lr: 0.000001
opt: adam
workers: 20
